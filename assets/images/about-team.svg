      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#f3f1eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="20" fill="url(#bgAbout)"/>
  <circle cx="400" cy="250" r="170" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="400" cy="250" r="68" fill="#0f766e"/>
  <text x="400" y="244" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">TDTT</text>
  <text x="400" y="268" text-anchor="middle" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">6 Thành viên</text>

  <!-- Lines -->
  <line x1="340" y1="210" x2="210" y2="130" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="460" y1="210" x2="590" y2="130" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="340" y1="290" x2="210" y2="370" stroke="#0f766e" stroke-width="2.5"/>
  <line x1="460" y1="290" x2="590" y2="370" stroke="#0f766e" stroke-width="2.5"/>

  <!-- 4 Pillars -->
  <g transform="translate(80,72)">
    <rect width="210" height="84" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
