    <text x="34" y="60" fill="#4b5563" font-family="system-ui, sans-serif" font-size="12">Tách 7 trang độc lập</text>
  </g>

  <g transform="translate(510,72)">
    <rect width="210" height="84" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
    <rect x="14" y="16" width="8" height="52" rx="4" fill="#1d4ed8"/>
    <text x="34" y="38" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="700">2. Nhận diện mẫu</text>
